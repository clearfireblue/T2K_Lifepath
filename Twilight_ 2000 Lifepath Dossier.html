    <button class="btn primary" data-act="openSheet">Open character sheet</button>
    ${done?'<span class="stamp olive">Ready for play</span>':'<span class="muted">Needs a moral code, a big dream, gear and rads to be complete.</span>'}</div>`;
  return `<section class="step">${head}${body}</section>`;
}

/* ---------- collapsible sections ---------- */
function isOpen(key){ return !S.closed[(S.cur||'')+':'+key]; }
function wrapStep(key, html, recap){
  html = html.trim()
    .replace(/^<section class="step([^"]*)">/, `<details class="step$1" data-sec="${key}" ${isOpen(key)?'open':''}>`)
    .replace(/<div class="step-head">([\s\S]*?)<\/div>/, (m,inner)=>`<summary class="step-head">${inner}${recap?`<span class="recap">${esc(recap)}</span>`:''}</summary>`)
    .replace(/<\/section>$/, '</details>');
  return html;
}
function recaps(c){
  const dd = derive(c), tl = timeline(c), ch = c.childhood;
  const done = dd.doneTerms;
  return {
    nation: [c.nationality, c.local?'local':''].filter(Boolean).join(', '),
    attrs: c.attrsLocked ? ATTRS.map(a=>`${a.k} ${LETTERS[c.attrs[a.k]]}`).join(' ') : (c.attrRoll?'In progress':''),
    child: ch ? [ch.name, ch.skill, ch.specialty].filter(Boolean).join(', ') : '',
    careers: c.careers.length ? [`${done} ${done===1?'term':'terms'}`, dd.rankName, tl?yrs(tl.y18, WAR_YEAR):''].filter(Boolean).join(', ') : '',
    war: warDone(c) ? `Hit ${capacities(dd).hit}, stress ${capacities(dd).stress}` : (c.atWar ? 'In progress' : (atWar(c)?'Ready':'')),
    final: finalDone(c) ? 'Ready for play' : (warDone(c) ? 'In progress' : '')
  };
}

/* ---------- service record ---------- */
function logGroup(text){
  const m = /^Term (\d+)/.exec(text);
  if(m) return 't'+(m[1]-1);
  if(/^At War/.test(text)) return 'war';
  if(/^Final:/.test(text)) return 'final';
  return 'early';
}
const END_OF_TERM = /Served \d+|years served|age effects|Age lowers|for war|for prison|Referee override|scrapped/;
function serviceRecord(c){
  const tl = timeline(c);
  const groups = new Map([['early',[]]]);
  c.careers.forEach((_,i)=>groups.set('t'+i,[]));
  for(const l of c.log){ const g = logGroup(l.text); if(!groups.has(g)) groups.set(g,[]); groups.get(g).push(l); }
  const order = [...groups.keys()].sort((a,b)=>{
    const rank = k => k==='early'?-1 : k==='war'?1e6 : k==='final'?1e6+1 : +k.slice(1);
    return rank(a)-rank(b);
  });
  const fmt = t => new Date(t).toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
  let html = '';
  for(const g of order){
    const entries = groups.get(g); if(!entries.length) continue;
    let title, yearOf = () => '';
    if(g==='early'){ title = 'Childhood and youth' + (tl?`, ${yrs(tl.birth, tl.y18)}`:''); }
    else if(g==='war'){ title = 'At War' + (tl?`, ${WAR_YEAR}`:''); yearOf = () => tl?WAR_YEAR:''; }
    else if(g==='final'){ title = 'Before play' + (tl?`, ${WAR_YEAR}`:''); yearOf = () => tl?WAR_YEAR:''; }
    else {
      const i = +g.slice(1), t = c.careers[i], car = t && CAREERS[t.career];
      const span = tl && tl.terms[i];
      title = `Term ${i+1}${car?`: ${car.n}`:t?'':' (scrapped)'}${span?`, ${yrs(span.start, span.end)}`:''}`;
      if(span) yearOf = text => END_OF_TERM.test(text) ? span.end : span.start;
    }
    const key = 'log:'+g;
    html += `<details class="lgroup" data-sec="${key}" ${isOpen(key)?'open':''}><summary>${esc(title)} <span class="muted">(${entries.length})</span></summary><ol>${
      entries.map(l=>{
        const text = l.text.replace(/^Term \d+: /,'').replace(/^At War: /,'').replace(/^Final: /,'');
        const y = yearOf(l.text);
        return `<li title="Recorded ${esc(fmt(l.t))}">${y?`<span class="yr">${y}</span>`:''}${esc(text)}</li>`;
      }).join('')}</ol></details>`;
  }
  const note = tl
    ? `<p class="note">Born ${tl.birth}. Turned 18 in ${tl.y18}. War broke out in ${WAR_YEAR} at age ${tl.finalAge}.</p>`
    : `<p class="note">Years are filled in once war breaks out, counting back from ${WAR_YEAR}.</p>`;
  return `<details class="log" data-sec="log" ${isOpen('log')?'open':''}><summary class="step-head"><h2>Service record</h2><span class="recap">${c.log.length} entries</span></summary>${note}${html}</details>`;
}

/* ---------- character sheet ---------- */
function sheetData(c){
  const dd = derive(c), f = ensureFinal(c), cap = capacities(dd), gd = f.gearDice;
  return {
    name: displayName(c), nickname: f.nickname, nationality: c.nationality, language: c.language, local: !!c.local,
    rank: dd.rankName, age: dd.age, cuf: LETTERS[dd.cuf], hit: cap.hit, stress: cap.stress,
    attrs: ATTRS.map(a=>({k:a.k, n:a.n, v:LETTERS[dd.attrs[a.k]], s:sides(dd.attrs[a.k])})),
    skills: SKILL_ORDER.map(s=>({n:s, a:SKILL_ATTR[s], v: s in dd.skills ? LETTERS[dd.skills[s]] : '–'})),
    specs: dd.specs.map(s=>s.name+(s.lang?` (${s.lang})`:'')),
    command: dd.skills.Command==null ? 'none' : LETTERS[dd.skills.Command],
    moral: f.moral, dream: f.dream, buddy: f.buddy, appearance: f.appearance, met: f.met,
    gear: describeGear(c), weapons: f.weapons,
    rations: gd && gd.food!=null ? `${gd.food} food, ${gd.water} clean water, ${gd.ammo} rounds of ammo` : '',
    rads: f.rads,
    born: timeline(c) ? timeline(c).birth : null,
    history: [`Childhood: ${c.childhood?c.childhood.name:'—'}${timeline(c)?`, ${yrs(timeline(c).birth, timeline(c).y18)}`:''}`,
      ...c.careers.map((t,i)=>`Term ${i+1}: ${CAREERS[t.career].n}${t.area?` (${CAREERS[t.area].n})`:''}, ${termYears(c,i)||`${t.years} ${t.years===1?'year':'years'}`}${t.promo&&t.promo.success?', promoted':''}`),
      c.atWar ? `At War${warCtx(c).drafted?' (drafted)':''}, ${WAR_YEAR}` : '']
      .filter(Boolean)
  };
}

async function downloadPdf(c){
  const set = t => { S.note = t; render(); };
  if(!window.jspdf || !window.jspdf.jsPDF){ set('The PDF tool did not load. Check your connection and try again.'); return; }
  const x = sheetData(c);
  const doc = new window.jspdf.jsPDF({unit:'pt', format:'letter'});
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 48;
  let y = M;
  const need = h => { if(y + h > H - M){ doc.addPage(); y = M; } };
  const line = (txt, size=10, bold=false, gap=4) => {
    doc.setFont('courier', bold?'bold':'normal'); doc.setFontSize(size);
    for(const l of doc.splitTextToSize(txt, W-2*M)){ need(size+gap); doc.text(l, M, y); y += size+gap; }
  };
  const head = t => { y += 8; need(24); doc.setDrawColor(80); doc.line(M, y-12, W-M, y-12); line(t, 12, true, 6); };
  doc.setTextColor(30,30,25);
  line('TWILIGHT: 2000 PERSONNEL FILE', 9, false, 6);
  line(x.name + (x.nickname?`  "${x.nickname}"`:''), 20, true, 8);
  line([x.nationality, x.language && `Language: ${x.language}`, x.rank, `Age ${x.age}`, x.born && `Born ${x.born}`].filter(Boolean).join('   '));
  head('Attributes');
  line(x.attrs.map(a=>`${a.k} ${a.v} (D${a.s})`).join('   '));
  line(`Hit capacity ${x.hit}   Stress capacity ${x.stress}   Coolness ${x.cuf}   Command ${x.command}   Rads ${x.rads??'-'}`);
  head('Skills');
  const half = Math.ceil(x.skills.length/2);
  for(let k=0;k<half;k++){
    const a = x.skills[k], b = x.skills[k+half];
    const col = s => s ? `${(s.n+' ('+s.a+')').padEnd(26,'.')} ${s.v}` : '';
    line(`${col(a).padEnd(34)}${col(b)}`);
  }
  head('Specialties'); line(x.specs.join(', ') || 'None');
  head('Gear'); x.gear.forEach(g=>line('- '+g)); if(x.rations) line('- '+x.rations); if(x.weapons) line('Weapon notes: '+x.weapons);
  head('Character');
  [['Moral code',x.moral],['Big dream',x.dream],['Buddy',x.buddy],['Appearance',x.appearance],['How we met',x.met]]
    .filter(([,v])=>v).forEach(([k,v])=>line(`${k}: ${v}`));
  if(x.local) line('Local: knows the area, has contacts and a home there, speaks the local language fluently.');
  head('Service'); x.history.forEach(h=>line(h));

  const filename = `${x.name.replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_') || 'character'}_T2K.pdf`;
  let dl = null;
  try{ dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; }catch(e){ dl = null; }
  if(dl){
    try{ await dl.save({filename, data: doc.output('blob')}); set(''); return; }
    catch(e){
      if(e && (e.code==='cancelled' || e.code==='declined' || e.code==='user_declined')){ set(''); return; }
      try{ await dl.save({filename, data: new Uint8Array(doc.output('arraybuffer'))}); set(''); return; }
      catch(e2){ set('The download was not saved. Try again, or use Print.'); return; }
    }
  }
  try{ doc.save(filename); set(''); }catch(e){ set('Downloads are not available here. Use Print instead.'); }
}

  <div class="topbar">
    <button class="backlink" data-act="back">Back to all files</button>
    <span class="savebar" id="savebar">${esc(Store.status)}</span>
  </div>
  <div class="dossier">
    <main class="paper">
      <div class="cover">
        <div class="namefield">
          <label for="nm">Name</label>
          <input id="nm" data-field="name" value="${esc(c.name)}" placeholder="Unnamed recruit ${c.fileNo}" autocomplete="off">
        </div>
        <div><div class="fileno">File ${esc(c.id)}</div><span class="stamp ${st.cls}">${esc(st.t)}</span></div>
      </div>
      ${(()=>{ const r = recaps(c); return [
        wrapStep('nation', stepNation(c), r.nation),
        wrapStep('attrs', stepAttrs(c), r.attrs),
        wrapStep('child', stepChild(c), r.child),
        wrapStep('careers', stepCareers(c), r.careers),
        wrapStep('war', stepAtWar(c), r.war),
        wrapStep('final', stepFinal(c), r.final)].join(''); })()}
      <div class="row" style="margin-top:14px"><button class="btn small" data-act="collapseAll">Collapse all</button><button class="btn small" data-act="expandAll">Expand all</button></div>
      ${serviceRecord(c)}
      <div class="row" style="margin-top:22px">
        ${S.confirmDelete
          ? `<span>Shred this file for good?</span><button class="btn danger" data-act="delete">Shred file</button><button class="btn" data-act="cancelDelete">Keep it</button>`
          : `<button class="btn danger small" data-act="askDelete">Shred file</button>`}
      </div>
    </main>
    ${sheet(c)}
  </div>`;
}

/* ================= render ================= */
const app = document.getElementById('app');
function render(){
  const active = document.activeElement;
  const field = active && active.dataset ? active.dataset.field : null;
  const pos = field ? active.selectionStart : null;
  const c0 = cur(); if(c0 && warDone(c0)) ensureFinal(c0);
  app.innerHTML = S.view==='sheet' ? viewSheet() : S.view==='file' ? viewFile() : viewRoster();
  S.flash = null;
  if(field){
    const el = app.querySelector(`[data-field="${field}"]`);
    if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(e){} }
  }
}
function updateSaveBar(){ const el=document.getElementById('savebar'); if(el) el.textContent = Store.status; }

app.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]');
  if(!b || b.disabled) return;
  act(b.dataset.act, b.dataset.v, b.dataset.v2);
});
app.addEventListener('toggle', e=>{
  const el = e.target;
  if(el && el.dataset && el.dataset.sec) S.closed[(S.cur||'')+':'+el.dataset.sec] = !el.open;
}, true);
app.addEventListener('change', e=>{
  const k = e.target.dataset.change;
  if(k==='gearModel') act(k, e.target.dataset.idx, e.target.value);
  else if(k) act(k, e.target.value);
});
app.addEventListener('input', e=>{
  const f = e.target.dataset.field; const c = cur();
  if(!f || !c) return;
  const v = e.target.value;
  if(f==='childLang'){ if(c.childhood) c.childhood.language = v; }
  else if(f.startsWith('f_')){ ensureFinal(c)[f.slice(2)] = v; c.updated = Date.now(); Store.queue(); return; }
  else if(f==='warLang'){ if(c.atWar) c.atWar.lang = v; }
  else if(f==='termLang'){ const t=c.careers[c.careers.length-1]; if(t && t.spec) t.spec.lang = v; }
  else c[f] = v;
  c.updated = Date.now(); Store.queue();
  if(f==='name') return;
  render();
});

Store.loadLocal();
render();
Store.connect();
</script>

</body>
</html>
